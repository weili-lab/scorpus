[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorpus"
version = "0.4.0"
description = "Sparse single-cell expression corpora with original metadata and in-memory composition."
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.11",
    "h5py>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=18",
    "pylance>=0.20",
    "dask[array]>=2024",
    "PyYAML>=6.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Sphinx toolchain used to build docs/ on ReadTheDocs (no autodoc, so scorpus's
# own imports are not exercised by the doc build).
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "furo",
]
demo = [
    "scanpy>=1.10",
    "dask[dataframe]>=2024",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/weili-lab/scorpus"
Documentation = "https://scorpus.readthedocs.io/en/latest/"
Repository = "https://github.com/weili-lab/scorpus"

[tool.setuptools.packages.find]
where = ["src"]
