[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scorpus"
version = "0.6.0"
description = "Sparse single-cell expression corpora with original metadata and in-memory composition."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anndata>=0.11",
    "h5py>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=18",
    "pylance>=0.20",
    "PyYAML>=6.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# to_anndata_lazy / write_h5ad: expression as a Dask array that stays on disk.
lazy = [
    "dask[array]>=2024",
]
# scanpy on the lazy export; scorpus patches two scanpy 1.12 Dask helpers on import.
scanpy = [
    "scorpus[lazy]",
    "scanpy>=1.12",
]
# rapids-singlecell on a CuPy lazy export (CUDA 12). RAPIDS wheels also need
# --extra-index-url https://pypi.nvidia.com
gpu = [
    "scorpus[lazy]",
    "cupy-cuda12x>=13",
    "rapids-singlecell-cu12>=0.18",
]
all = [
    "scorpus[scanpy,gpu]",
]
# Sphinx toolchain used to build docs/ on ReadTheDocs (no autodoc, so scorpus's
# own imports are not exercised by the doc build).
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "furo",
]
# The walkthrough notebooks.
demo = [
    "scorpus[scanpy]",
    "dask[dataframe]>=2024",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/weili-lab/scorpus"
Documentation = "https://scorpus.readthedocs.io/en/latest/"
Repository = "https://github.com/weili-lab/scorpus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Errors and likely bugs only (pyflakes plus syntax/statement errors); no style rules.
select = ["E4", "E7", "E9", "F"]
