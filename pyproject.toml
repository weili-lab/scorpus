[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturb-data-lab"
version = "0.2.0"
description = "Sparse expression corpora with original metadata and in-memory composition."
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11",
    "deprecation==2.1.0",
    "h5py>=3.10",
    "lancedb==0.30.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=18",
    "pylance>=0.20",
    "zarr>=3",
    "torch>=2.2",
    "dask[array]>=2024",
    "PyYAML>=6.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
pca = [
    "scikit-learn>=1.4",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-jupyter>=0.25",
    "pymdown-extensions>=10",
]
demo = [
    "scanpy>=1.10",
    "dask[dataframe]>=2024",
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
