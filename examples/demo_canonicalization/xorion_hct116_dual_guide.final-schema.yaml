kind: canonicalization-schema
contract_version: 0.3.0
dataset_id: xorion_hct116_dual_guide
status: ready
description: Demo-reviewed canonicalization schema for the Xorion HCT116 dual-guide subset.
gene_mapping:
  enabled: false
  engine: identity
  source_namespace: gene_symbol
  target_namespace: gene_symbol
  mapping_file: null
obs_column_mappings:
- canonical_name: assay
  strategy: literal
  literal_value: perturb-seq
- canonical_name: batch_id
  strategy: source-field
  source_column: sample
- canonical_name: cell_context
  strategy: literal
  literal_value: HCT116
- canonical_name: cell_id
  strategy: passthrough
- canonical_name: cell_line_or_type
  strategy: literal
  literal_value: HCT116
- canonical_name: condition
  strategy: source-field
  source_column: gene_target
  fallback: unknown
  transforms:
  - name: map_control_labels
    args:
      candidates: [Non-Targeting]
      output: ctrl
- canonical_name: dataset_id
  strategy: source-field
  source_column: dataset_id
- canonical_name: dataset_index
  strategy: literal
  literal_value: '1'
- canonical_name: disease_state
  strategy: literal
  literal_value: cancer
- canonical_name: donor_id
  strategy: 'null'
- canonical_name: dose
  strategy: 'null'
- canonical_name: dose_unit
  strategy: 'null'
- canonical_name: global_row_index
  strategy: row-index
- canonical_name: local_row_index
  strategy: row-index
- canonical_name: perturb_label
  strategy: source-field
  source_column: guide_target
  fallback: unknown
  transforms:
  - name: regex_sub
    args:
      pattern: '(?i)^non-targeting_[^|]+\|non-targeting_[^|]+$'
      replacement: ctrl
- canonical_name: perturb_type
  strategy: conditional
  cases:
  - source_column: gene_target
    predicate: equals
    value: Non-Targeting
    result_literal: control
  default_literal: genetic
- canonical_name: sex
  strategy: literal
  literal_value: unknown
- canonical_name: species
  strategy: literal
  literal_value: human
- canonical_name: timepoint
  strategy: 'null'
- canonical_name: timepoint_unit
  strategy: 'null'
- canonical_name: tissue
  strategy: literal
  literal_value: unknown
obs_extensible:
- raw_source_column: sample
  canonical_name: sample
- raw_source_column: num_features
  canonical_name: num_features
- raw_source_column: guide_target
  canonical_name: guide_target
- raw_source_column: gene_target
  canonical_name: gene_target
- raw_source_column: n_genes_by_counts
  canonical_name: n_genes_by_counts
- raw_source_column: total_counts
  canonical_name: total_counts
- raw_source_column: total_counts_mt
  canonical_name: total_counts_mt
- raw_source_column: pct_counts_mt
  canonical_name: pct_counts_mt
- raw_source_column: pass_guide_filter
  canonical_name: pass_guide_filter
var_column_mappings:
- canonical_name: origin_index
  strategy: passthrough
- canonical_name: gene_id
  strategy: source-field
  source_column: feature_id
- canonical_name: canonical_gene_id
  strategy: gene-mapping
  enabled: false
  engine: identity
  source_namespace: gene_symbol
  target_namespace: gene_symbol
- canonical_name: global_id
  strategy: auto
var_extensible:
- raw_source_column: mt
  canonical_name: mt
- raw_source_column: n_cells_by_counts
  canonical_name: n_cells_by_counts
- raw_source_column: mean_counts
  canonical_name: mean_counts
- raw_source_column: pct_dropout_by_counts
  canonical_name: pct_dropout_by_counts
- raw_source_column: total_counts
  canonical_name: total_counts
notes:
- Demo schema updates the reviewed Xorion mapping for the small public subset.
- dataset_index is fixed to 1 because the demo corpus appends Xorion after Marson.
- condition uses gene_target, while perturb_label keeps guide-pair detail except for all-non-targeting controls.
- raw feature_id values mix gene symbols and Ensembl-like identifiers, so canonical_gene_id stays identity.
