name: ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Rules are set in pyproject.toml ([tool.ruff.lint]).
      - run: pip install ruff==0.17.3
      - run: ruff check src tests
