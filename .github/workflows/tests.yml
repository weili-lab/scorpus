name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # demo extra brings scanpy for the lazy-export tests; GPU tests skip without CUDA.
      - run: pip install -e ".[demo]" pytest
      - run: pytest -q
