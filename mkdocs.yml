site_name: scorpus
site_description: Sparse single-cell corpora that are cheap to random-access, easy to compose, and ready for AnnData
repo_url: https://github.com/weili-lab/scorpus
edit_uri: edit/docs/github-pages-demo/docs/

theme:
  name: material
  logo: assets/scorpus_mark.png
  favicon: assets/scorpus_favicon.png
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Get Started:
    - Quickstart: quickstart.md
    - Installation: installation.md
  - Guides:
    - Conversion & Composition: composable_corpora.md
    - AnnData Handoff: anndata_scanpy_handoff.md
    - Scanpy & RAPIDS: scanpy_rapids.md
    - Backend Notes: backend_note.md
    - pertTF Integration: perttf_loader.md
  - Curated Corpora (advanced):
    - Overview: demo_canonicalization.md
    - Bash Walkthrough: bash_demo.md
    - Jupyter Walkthrough: jupyter_demo.md
    - Rendered Notebook: demo_walkthrough.ipynb
    - Inspection & Materialization: inspect_materialize.md
    - Canonicalization Handbook: canonicalization_handbook.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore: ["*.py"]

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
